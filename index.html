<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{--bg:#1a1c2c;--panel:#262b44;--panel2:#333c57;--line:#566c86;--ink:#f4f4f4;--muted:#94b0c2;--red:#e43b44;--gold:#ffcd75;--green:#a7f070}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:'VT323',ui-monospace,Menlo,monospace;font-size:21px;line-height:1.15;min-height:100vh;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px;
    -webkit-font-smoothing:none;-webkit-text-size-adjust:100%}
  .px{font-family:'Press Start 2P',ui-monospace,monospace;letter-spacing:.5px}
  .wrap{max-width:520px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  header h1{font-size:13px;color:var(--gold);text-shadow:2px 2px 0 #b13e53}
  header .sub{font-size:17px;color:var(--muted);margin-top:4px}
  .tagline{font-size:6px;color:var(--muted);margin-top:6px;letter-spacing:.3px}
  .pxi{width:1.05em;height:1.05em;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:-0.18em}
  .avatar .pxi{width:48px;height:48px;vertical-align:0}
  .pick.av .pxi{width:34px;height:34px;vertical-align:-8px}
  .nudge .pxi{width:28px;height:28px;vertical-align:-6px}
  .gear .pxi{width:28px;height:28px;vertical-align:-6px}
  .lbl .pxi,.sheet h3 .pxi,.alert .px .pxi{width:16px;height:16px;vertical-align:-4px}
  .hearts svg{width:21px;height:18px;margin-right:2px;shape-rendering:crispEdges}
  .btn.sos{background:var(--red);color:#fff;margin-left:auto}
  .btn.sos.armed{background:var(--gold);color:#1a1c2c;animation:blink 0.5s steps(2) infinite}
  .sosbox{border:3px solid var(--red);background:#5d275d;animation:flash 1s steps(2) infinite}
  .sosbox .lbl{color:#fff;font-size:9px}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
  a{color:#73eff7}
  .btn{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.3;padding:11px 12px;background:var(--panel2);
    color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 #000;text-transform:uppercase;text-decoration:none;display:inline-block}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .btn.primary{background:#38b764;color:#1a1c2c}
  .btn.warn{background:#b13e53}
  .btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--muted)}
  .btn.small{font-size:8px;padding:8px 9px;border-width:2px;box-shadow:2px 2px 0 #000}
  .btn[disabled]{opacity:.45}
  .gear{font-size:26px;width:46px;height:44px;border:3px solid var(--line);background:var(--panel)}

  .card{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 #000;padding:14px;margin-bottom:22px;position:relative}
  .card::before{content:"";position:absolute;inset:3px;border:2px solid var(--c,#41a6f6);opacity:.55;pointer-events:none}
  .card.stale .bars{opacity:.55}
  .card h2{font-size:11px;color:var(--gold);margin-bottom:14px;line-height:1.5}
  .head{display:flex;gap:12px;align-items:center}
  .avatar{width:58px;height:58px;flex:none;display:grid;place-items:center;font-size:34px;background:var(--bg);border:3px solid var(--c,#41a6f6)}
  .who{flex:1;min-width:0}
  .name{font-size:12px;color:var(--c,#41a6f6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--muted);font-size:18px;margin-top:4px}
  .hearts{margin-top:3px;font-size:22px;letter-spacing:1px}
  .seen{text-align:right;font-size:17px;color:var(--muted);flex:none}
  .seen b{display:block;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);margin-bottom:4px}
  .seen.old b{color:#ef7d57}
  .crownline{font-size:7px;color:var(--gold);margin-top:4px;line-height:1.4}
  .you-tag{font-family:'Press Start 2P',monospace;font-size:7px;background:var(--c);color:#1a1c2c;padding:3px 4px;margin-left:6px;vertical-align:middle}

  .box{margin-top:12px;padding:8px 10px;background:#1a1c2c;font-size:19px;word-wrap:break-word}
  .box .lbl{font-family:'Press Start 2P',monospace;font-size:8px;display:block;margin-bottom:5px}
  .quest{border:2px dashed var(--gold)} .quest .lbl{color:var(--gold)}
  .quest.overdue{border:2px solid var(--red);animation:flash 1s steps(2) infinite}
  .quest.overdue .lbl{color:var(--red)}
  @keyframes flash{50%{background:#5d275d}}
  .loc{border:2px solid var(--line)} .loc .lbl{color:#73eff7}
  .loc .fine{color:var(--muted);font-size:17px}
  .note{border-left:4px solid var(--c);white-space:pre-wrap} .note .lbl{color:var(--muted);font-size:7px}
  .rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:17px;padding:2px 7px;border:2px solid var(--line);background:#1a1c2c}
  .bars{margin-top:12px;display:grid;gap:7px}
  .bar{display:grid;grid-template-columns:22px 82px 1fr 26px;align-items:center;gap:6px}
  .bar .ic{font-size:17px;text-align:center}
  .bar .lb{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted)}
  .bar .val{text-align:right;font-size:19px}
  .segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:16px;padding:2px;background:#000;border:2px solid var(--line)}
  .seg{background:#262b44} .seg.on{background:var(--sc)}
  .bar.low .segs{border-color:var(--red);animation:pulse 1.2s steps(2) infinite}
  .bar.low .val{color:var(--red)}

  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .nudge{font-size:24px;width:48px;height:44px;background:var(--panel2);border:3px solid var(--ink);box-shadow:3px 3px 0 #000}
  .nudge:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .nudge[disabled]{opacity:.4}
  .hint{font-size:16px;color:var(--muted);margin-top:6px}

  details.log{margin-top:12px}
  details.log summary{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);cursor:pointer;list-style:none}
  details.log summary::-webkit-details-marker{display:none}
  details.log summary::before{content:"> "} details.log[open] summary::before{content:"v "}
  .logrow{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed #333c57;font-size:18px}
  .logrow .t{color:var(--muted);flex:none;width:92px} .logrow .h{flex:none;color:var(--red)}

  .alert{background:#5d275d;border:3px solid var(--gold);box-shadow:4px 4px 0 #000;padding:12px;margin-bottom:18px}
  .alert .px{font-size:9px;color:var(--gold);margin-bottom:8px}
  .alert ul{list-style:none;margin-bottom:10px} .alert li{font-size:20px;padding:2px 0}
  .banner{border:2px dashed var(--line);padding:9px 10px;margin-bottom:16px;font-size:18px;color:var(--muted)}
  .banner b{color:var(--ink)}
  .empty{border:3px dashed var(--line);padding:18px;text-align:center;color:var(--muted);margin-bottom:22px}
  .empty .px{font-size:9px;color:var(--ink);margin-bottom:10px;line-height:1.6}
  .code{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);background:#000;border:2px solid var(--line);padding:10px;text-align:center;letter-spacing:1px;user-select:all;-webkit-user-select:all;margin:8px 0;word-break:break-all;line-height:1.5}

  .sheet{position:fixed;inset:0;background:rgba(10,10,20,.82);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.hidden{display:none}
  .sheet .inner{background:var(--panel);border:3px solid var(--ink);border-bottom:none;width:100%;max-width:520px;max-height:92vh;overflow:auto;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .sheet h2{font-size:11px;color:var(--gold);margin-bottom:14px}
  .sheet h3{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ink);margin:18px 0 8px}
  .field{margin-bottom:14px}
  .field > label,.flabel{display:block;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);margin-bottom:7px}
  input[type=text],input[type=time],textarea,select{width:100%;font:inherit;font-size:21px;color:var(--ink);background:#1a1c2c;border:2px solid var(--line);padding:7px 9px;border-radius:0;-webkit-appearance:none;appearance:none}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
  .slider{display:grid;grid-template-columns:22px 82px 1fr 26px;align-items:center;gap:6px;margin-bottom:9px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:10px;background:#000;border:2px solid var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;margin-top:-10px;background:var(--sc,#fff);border:2px solid #fff;border-radius:0}
  input[type=range]::-moz-range-track{height:8px;background:#000;border:2px solid var(--line)}
  input[type=range]::-moz-range-thumb{width:18px;height:22px;background:var(--sc,#fff);border:2px solid #fff;border-radius:0}
  .pick{display:flex;flex-wrap:wrap;gap:6px}
  .pick button{font-size:17px;padding:4px 8px;border:2px solid var(--line);background:#1a1c2c;color:var(--ink)}
  .pick button.sel{border-color:var(--gold);background:#5d275d}
  .pick.av button{font-size:26px;width:46px;height:46px;padding:0}
  .pick.col button{width:34px;height:34px;padding:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sheet .footer{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
  .ok{color:var(--green)} .bad{color:#ef7d57}

  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#000;border:3px solid var(--gold);padding:9px 14px;font-size:19px;z-index:20;max-width:90vw;display:none}
  .msg{padding:30px 10px;text-align:center;color:var(--muted)}
  .msg .px{font-size:10px;color:var(--gold);margin-bottom:14px;line-height:1.7}
  .blink{animation:blink 1s steps(2) infinite} @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="px">TUNGA</h1>
      <div class="tagline px">THE ULTIMATE NEEDY GIRLFRIEND APP</div>
      <div class="sub" id="subtitle">Loading save file<span class="blink">_</span></div>
    </div>
    <button class="gear" id="gear" aria-label="Settings" onclick="openSettings()" style="display:none"></button>
  </header>
  <div id="install"></div>
  <div id="alerts"></div>
  <main id="app"><div class="msg"><div class="px">INSERT COIN</div>Loading save file<span class="blink">_</span></div></main>
</div>
<div class="sheet hidden" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="game.js"></script>
<script>
const STATS=[
  {k:'energy', label:'ENERGY', icon:'⚡', c:'#ffcd75'},
  {k:'food',   label:'FOOD',   icon:'🍎', c:'#ef7d57'},
  {k:'water',  label:'WATER',  icon:'💧', c:'#41a6f6'},
  {k:'stamina',label:'STAMINA',icon:'💪', c:'#a7f070'},
  {k:'mood',   label:'MOOD',   icon:'🙂', c:'#ff77a8'},
  {k:'social', label:'SOCIAL', icon:'💬', c:'#73eff7'},
];
const STATUSES=[
  {k:'hug',t:'Needs a hug',i:'🫂'},{k:'hangry',t:'Hangry',i:'😤'},{k:'dnd',t:'Do not disturb',i:'🔕'},
  {k:'chatty',t:'Up for a chat',i:'💬'},{k:'field',t:'In the field',i:'🦇'},{k:'fumes',t:'Running on fumes',i:'🪫'},
  {k:'headache',t:'Headache',i:'🤕'},{k:'overload',t:'Overloaded',i:'🌀'},{k:'cosy',t:'Cosy mode',i:'🛋️'},
  {k:'focus',t:'Deep focus',i:'🎯'},{k:'poorly',t:'Poorly',i:'🤒'},{k:'buzzing',t:'Buzzing',i:'✨'},
  {k:'cold',t:'Too cold',i:'🥶'},{k:'hot',t:'Too hot',i:'🥵'},
  {k:'sad',t:'Feeling sad',i:'😢'},{k:'irritable',t:'Irritable',i:'😠'},{k:'content',t:'Content',i:'😌'},
];
const AVATARS=['🦊','🦇','🦉','🦔','🐻','🐺','🐸','🐱','🐶','🐉','🧙','🌿','🐑','🍄','🤖','👾'];
const COLOURS=['#41a6f6','#ff77a8','#a7f070','#ffcd75','#ef7d57','#73eff7','#b48cf2','#38b764'];
const NUDGES=[
  {k:'hug',i:'🫂',t:'sent you a hug'},{k:'love',i:'❤️',t:'sent love'},
  {k:'snack',i:'🍪',t:'says eat something'},{k:'water',i:'💧',t:'says drink some water'},
  {k:'rest',i:'😴',t:'says go and rest'},{k:'ping',i:'📡',t:'wants a status update'},
  {k:'fight',i:'⚔️',t:'challenges you to a fight',hidden:true},
  {k:'ready',i:'⚔️',t:'is ready to fight! Tap Fight to join',hidden:true},
  {k:'crown',i:'👑',t:'won 15 fights and wears the crown for a week. Bow down, peasant!',hidden:true},
];

const CFG=window.PARTY_CONFIG||{};
const BASE=String(CFG.supabaseUrl||'').replace(/\/+$/,''), KEY=String(CFG.supabaseKey||'');
const STORE='party-status-v1';
let S={code:null,playerId:null};
let players={}, nudges=[], loaded=false, gone=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=n=>Math.max(0,Math.min(10,Math.round(Number(n)||0)));
function loadStore(){try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&v.code)S=v}catch(e){}}
function saveStore(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function toast(t,ms=2800){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',ms)}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
const fmtCode=c=>String(c||'').replace(/(.{4})(?=.)/g,'$1-');
const cleanCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

/* ---------- server calls ---------- */
function hdrs(forFunction){const h={'Content-Type':'application/json',apikey:KEY};if(forFunction||KEY.startsWith('eyJ'))h.Authorization='Bearer '+KEY;return h}
async function rpc(name,args){
  let r,text;
  try{r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:hdrs(false),body:JSON.stringify(args||{})});text=await r.text()}
  catch(e){const err=new Error('No connection');err.offline=true;throw err}
  if(!r.ok){let m='';try{m=JSON.parse(text).message}catch(e){} const err=new Error(m||('Server error '+r.status)); if(r.status>=500||r.status===0) err.offline=true; throw err}
  return text?JSON.parse(text):null;
}
async function notify(body){
  try{const r=await fetch(BASE+'/functions/v1/notify',{method:'POST',headers:hdrs(true),body:JSON.stringify(body)});
    if(!r.ok) return null; return await r.json()}catch(e){return null}
}

/* ---------- time + stats helpers ---------- */
function ago(iso){
  if(!iso) return 'never';
  const m=Math.floor((Date.now()-new Date(iso))/60000);
  if(m<1) return 'just now'; if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function clock(iso){return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function shortDate(iso){const d=new Date(iso);const today=new Date().toDateString()===d.toDateString();
  return (today?'Today ':d.toLocaleDateString([], {weekday:'short'})+' ')+clock(iso)}
function hp(stats){const v=STATS.map(s=>clamp(stats?.[s.k]));return v.reduce((a,b)=>a+b,0)/v.length}
/* Every icon is drawn as a 16x16 sprite in the app's 16-colour palette, so nothing looks like a modern emoji. */
const PAL=['333c57','5d275d','b13e53','e43b44','ef7d57','ffcd75','a7f070','38b764','257179','29366f','3b5dc9','41a6f6','73eff7','f4f4f4','94b0c2','566c86']
  .map(h=>[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]);
const pxCache={};
function pxURL(e){
  if(e in pxCache) return pxCache[e];
  let url='';
  try{
    const N=16,Q=6,B=N*Q,c=document.createElement('canvas');c.width=c.height=B;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.textAlign='center';x.textBaseline='middle';x.fillStyle='#f4f4f4';
    x.font=Math.round(B*0.8)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.fillText(e,B/2,B/2+B*0.05);
    const d=x.getImageData(0,0,B,B).data,o=document.createElement('canvas');o.width=o.height=N;
    const ox=o.getContext('2d'),img=ox.createImageData(N,N);let any=false;
    for(let py=0;py<N;py++)for(let qx=0;qx<N;qx++){
      let r=0,g=0,b=0,a=0;
      for(let sy=0;sy<Q;sy++)for(let sx=0;sx<Q;sx++){const i=((py*Q+sy)*B+qx*Q+sx)*4,al=d[i+3]/255;r+=d[i]*al;g+=d[i+1]*al;b+=d[i+2]*al;a+=al}
      if(a/(Q*Q)<0.5) continue;
      r/=a;g/=a;b/=a;let best=0,bd=1e12;
      for(let k=0;k<PAL.length;k++){const q=PAL[k],dd=(r-q[0])**2*0.3+(g-q[1])**2*0.59+(b-q[2])**2*0.11;if(dd<bd){bd=dd;best=k}}
      const j=(py*N+qx)*4;img.data[j]=PAL[best][0];img.data[j+1]=PAL[best][1];img.data[j+2]=PAL[best][2];img.data[j+3]=255;any=true;
    }
    if(any){ox.putImageData(img,0,0);url=o.toDataURL()}
  }catch(err){}
  return pxCache[e]=url;
}
function px(e){const u=pxURL(e);return u?`<img class="pxi" src="${u}" alt="">`:e}
const HEART=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
function heartSVG(kind){
  let r='';
  HEART.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='X')r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${kind==='on'||(kind==='half'&&x<4)?'#e43b44':'#333c57'}"/>`}));
  return `<svg viewBox="0 0 7 6" aria-hidden="true">${r}</svg>`;
}
function hearts(stats){
  const h=hp(stats)/2; let out='';
  for(let i=0;i<5;i++) out+=heartSVG(h>=i+1?'on':h>=i+0.5?'half':'off');
  return out;
}
function level(p){return Math.floor((p.checkins||0)/7)+1}
function showMsg(title,body){$('#app').innerHTML=`<div class="msg"><div class="px">${esc(title)}</div>${body}</div>`}

/* WGS84 lat/lon to OS grid reference (Helmert transform, good to about 5 m). Empty outside Great Britain. */
function osGrid(lat,lon){
  if(!(lat>49.8&&lat<61&&lon>-8.7&&lon<1.9)) return '';
  const rad=Math.PI/180;
  let a=6378137,b=6356752.314245,e2=1-(b*b)/(a*a);
  let phi=lat*rad,lam=lon*rad,nu=a/Math.sqrt(1-e2*Math.sin(phi)**2);
  const x1=nu*Math.cos(phi)*Math.cos(lam),y1=nu*Math.cos(phi)*Math.sin(lam),z1=nu*(1-e2)*Math.sin(phi);
  const tx=-446.448,ty=125.157,tz=-542.060,s=1+20.4894e-6,rx=-0.1502/3600*rad,ry=-0.2470/3600*rad,rz=-0.8421/3600*rad;
  const x2=tx+x1*s-y1*rz+z1*ry,y2=ty+x1*rz+y1*s-z1*rx,z2=tz-x1*ry+y1*rx+z1*s;
  a=6377563.396;b=6356256.909;e2=1-(b*b)/(a*a);
  const p=Math.sqrt(x2*x2+y2*y2);phi=Math.atan2(z2,p*(1-e2));let prev=9;
  while(Math.abs(phi-prev)>1e-12){nu=a/Math.sqrt(1-e2*Math.sin(phi)**2);prev=phi;phi=Math.atan2(z2+e2*nu*Math.sin(phi),p)}
  lam=Math.atan2(y2,x2);
  const F0=0.9996012717,phi0=49*rad,lam0=-2*rad,N0=-100000,E0=400000,n=(a-b)/(a+b),n2=n*n,n3=n*n*n;
  const cos=Math.cos(phi),sin=Math.sin(phi);nu=a*F0/Math.sqrt(1-e2*sin*sin);
  const rho=a*F0*(1-e2)/Math.pow(1-e2*sin*sin,1.5),eta2=nu/rho-1;
  const M=b*F0*((1+n+1.25*n2+1.25*n3)*(phi-phi0)-(3*n+3*n2+2.625*n3)*Math.sin(phi-phi0)*Math.cos(phi+phi0)
    +(1.875*n2+1.875*n3)*Math.sin(2*(phi-phi0))*Math.cos(2*(phi+phi0))-(35/24)*n3*Math.sin(3*(phi-phi0))*Math.cos(3*(phi+phi0)));
  const tan2=Math.tan(phi)**2,tan4=tan2*tan2,cos3=cos**3,cos5=cos**5,dl=lam-lam0;
  const N=M+N0+(nu/2)*sin*cos*dl**2+(nu/24)*sin*cos3*(5-tan2+9*eta2)*dl**4+(nu/720)*sin*cos5*(61-58*tan2+tan4)*dl**6;
  const E=E0+nu*cos*dl+(nu/6)*cos3*(nu/rho-tan2)*dl**3+(nu/120)*cos5*(5-18*tan2+tan4+14*eta2-58*tan2*eta2)*dl**5;
  if(!(E>=0&&E<700000&&N>=0&&N<1300000)) return '';
  const e100=Math.floor(E/100000),n100=Math.floor(N/100000);
  let l1=(19-n100)-(19-n100)%5+Math.floor((e100+10)/5),l2=(19-n100)*5%25+e100%5;
  if(l1>7)l1++; if(l2>7)l2++;
  const pad=v=>String(Math.floor(v%100000)).padStart(5,'0');
  return String.fromCharCode(l1+65,l2+65)+' '+pad(E)+' '+pad(N);
}
function w3w(text){const m=String(text||'').toLowerCase().match(/(?:^|[\s/])([a-z]{2,}\.[a-z]{2,}\.[a-z]{2,})(?=$|[\s,;])/);return m?m[1]:''}

/* ---------- boot ---------- */
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
let swReady=null;
async function boot(){
  if(!BASE||!KEY){$('#subtitle').textContent='Not set up';showMsg('NOT SET UP YET','This copy of the app has no server details. Fill in config.js.');return}
  if('serviceWorker' in navigator){
    swReady=navigator.serviceWorker.register('sw.js').catch(()=>null);
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='refresh')refresh()});
  }
  loadStore();
  const m=location.hash.match(/^#join=([A-Za-z0-9-]+)/);
  renderInstall();
  if(!S.code){ $('#subtitle').textContent='No party yet'; renderStart(m?cleanCode(m[1]):''); return }
  start();
}
function start(){
  $('#gear').innerHTML=px('⚙️'); $('#gear').style.display='';
  refresh();
  setInterval(()=>{if(document.visibilityState==='visible')refresh()},20000);
  window.addEventListener('online',()=>refresh());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
  resyncPush();
}
function renderInstall(){
  $('#install').innerHTML=(isIOS()&&!standalone())
    ?`<div class="banner"><b>Install this app:</b> tap the Share button, then <b>Add to Home Screen</b>, then open it from there. Notifications only work from the home screen version.</div>`:'';
}

/* ---------- start / join ---------- */
function renderStart(prefill){
  $('#app').innerHTML=`<section class="card"><h2 class="px">NEW GAME</h2>
    <p style="margin-bottom:12px">Start a party, then give the code to your player 2.</p>
    <div class="actions" style="margin-top:0"><button class="btn primary" id="newBtn" onclick="createParty()">Start a party</button></div></section>
    <section class="card"><h2 class="px">JOIN GAME</h2>
    <div class="field"><label for="jCode">Party code</label><input type="text" id="jCode" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" value="${esc(fmtCode(prefill||''))}"></div>
    <div class="actions" style="margin-top:0"><button class="btn primary" id="joinBtn" onclick="joinParty()">Join</button></div></section>`;
}
async function createParty(){
  $('#newBtn').disabled=true;
  try{const code=await rpc('party_create',{});S={code,playerId:null};saveStore();start()}
  catch(e){toast('Couldn’t start a party: '+e.message,5000);$('#newBtn').disabled=false}
}
async function joinParty(){
  const code=cleanCode($('#jCode').value); if(code.length<8){toast('That code looks too short.');return}
  $('#joinBtn').disabled=true;
  try{
    const d=await rpc('party_get',{p_code:code});

  }catch(e){toast('Couldn’t join: '+e.message,5000);$('#joinBtn').disabled=false}

/* ---------- load + render ---------- */
let refreshing=false;
async function refresh(){
  if(refreshing||!S.code) return; refreshing=true;
  try{
    await flushOutbox();
    const d=await rpc('party_get',{p_code:S.code});
    if(!d){gone=true;$('#subtitle').textContent='Party not found';
      showMsg('PARTY NOT FOUND','This party no longer exists.<div class="actions" style="justify-content:center"><button class="btn" onclick="leaveNow()">Start again</button></div>');return}
    const next={}; (d.players||[]).forEach(p=>{next[p.id]=p.data||{}});
    const ob=getOutbox(); if(ob&&ob.code===S.code&&next[ob.id]) next[ob.id]=ob.doc;
    players=next; nudges=d.nudges||[]; loaded=true;
    syncTally();
    if(!busy()) render();
  }catch(e){
    if(!loaded){$('#subtitle').textContent='Offline';showMsg('NO SIGNAL','Can’t reach the server. It will retry when you’re back online.')}
    else $('#subtitle').textContent='Offline · showing last known';
  }finally{refreshing=false}
}
function busy(){
  if(window.Arena&&Arena.isOpen()) return true;
  if(!$('#sheet').classList.contains('hidden')) return true;
  const a=document.activeElement; return !!(a&&$('#app').contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName));
}
setInterval(()=>{if(loaded&&!gone&&!busy()&&document.visibilityState==='visible')render()},60000);

function render(){
  if(gone) return;
  const n=Object.keys(players).length;
  $('#subtitle').textContent=`${n} player${n===1?'':'s'} in party`;
  const me=players[S.playerId];
  if(!me){ renderWho(); renderAlerts(); return }
  const others=Object.entries(players).filter(([id])=>id!==S.playerId);
  let html=card(S.playerId,me,true);
  if(!others.length){
    html+=`<div class="empty"><div class="px">WAITING FOR PLAYER 2<span class="blink">_</span></div>
      Send them the app link and this party code:<div class="code">${esc(fmtCode(S.code))}</div>
      <button class="btn small" onclick="copyInvite()">Copy invite</button></div>`;
  }
  others.sort((a,b)=>String(b[1].updatedAt||'').localeCompare(String(a[1].updatedAt||''))).forEach(([id,p])=>html+=card(id,p,false));
  $('#app').innerHTML=html;
  renderAlerts();
}

function locBlock(l){
  if(!l||(l.lat==null&&!l.text)) return '';
  const has=typeof l.lat==='number'&&typeof l.lng==='number';
  const grid=has?osGrid(l.lat,l.lng):'', words=w3w(l.text);
  let h=`<div class="box loc"><span class="lbl">${px('📍')} LAST LOCATION${l.at?' · '+esc(shortDate(l.at)):''}</span>`;
  if(l.text) h+=`<div>${esc(l.text)}</div>`;
  if(has) h+=`<div class="fine">${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}${l.acc?' · ±'+esc(l.acc)+' m':''}${grid?' · '+grid:''}</div>`;
  h+='<div class="rowbtns">';
  if(has) h+=`<a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${l.lat},${l.lng}">Open in Maps</a>`;
  if(words) h+=`<a class="btn small" target="_blank" rel="noopener" href="https://what3words.com/${esc(words)}">what3words</a>`;
  return h+'</div></div>';
}

function card(id,p,mine){
  const stale=!p.updatedAt||(Date.now()-new Date(p.updatedAt))>12*3600e3;
  const col=COLOURS.includes(p.colour)?p.colour:'#41a6f6';
  const av=AVATARS.includes(p.avatar)?p.avatar:'👾';
  let quest='';
  if(p.quest&&p.quest.text){
    const back=p.quest.backBy?new Date(p.quest.backBy):null;
    const overdue=back&&Date.now()>back.getTime();
    quest=`<div class="box quest ${overdue?'overdue':''}"><span class="lbl">${overdue?px('⚠️')+' OVERDUE · NO CHECK-IN':px('⚔️')+' CURRENT QUEST'}</span>${esc(p.quest.text)}${back?` <span style="color:var(--muted)">· back by ${esc(shortDate(back))}</span>`:''}`
      +(overdue&&!mine?`<div style="margin-top:6px">Try calling. Last known location is below.</div>`:'')
      +(mine?`<div class="rowbtns"><button class="btn small primary" onclick="questDone(this)">I'm safe · quest done</button>${back?`<button class="btn small" onclick="extendQuest(this)">+30 min</button>`:''}</div>`:'')
      +`</div>`;
  }
  const chips=(p.status||[]).map(k=>STATUSES.find(s=>s.k===k)).filter(Boolean).map(s=>`<span class="chip">${px(s.i)} ${esc(s.t)}</span>`).join('');
  const bars=STATS.map(s=>{
    const v=clamp(p.stats?.[s.k]);
    const segs=Array.from({length:10},(_,i)=>`<div class="seg ${i<v?'on':''}"></div>`).join('');
    return `<div class="bar ${v<=3?'low':''}" style="--sc:${s.c}"><span class="ic">${px(s.icon)}</span><span class="lb">${s.label}</span><div class="segs">${segs}</div><span class="val">${v}</span></div>`;
  }).join('');
  const log=(p.log||[]).slice(0,10).map(l=>`<div class="logrow"><span class="t">${esc(shortDate(l.at))}</span><span class="h">${hearts(l.stats)}</span><span>${esc(l.note||'')}</span></div>`).join('');
  let sos='';
  if(p.sos&&p.sos.at){
    sos=mine
      ?`<div class="box sosbox"><span class="lbl">${px('🆘')} SOS ACTIVE · SENT ${esc(shortDate(p.sos.at))}</span>Your party has been alerted${p.sos.located?' with your GPS location':''}. In danger? Call 999.
         <div class="rowbtns"><button class="btn small" onclick="sosClear(this)">I'm OK · cancel SOS</button></div></div>`
      :`<div class="box sosbox"><span class="lbl">${px('🆘')} EMERGENCY · ${esc(shortDate(p.sos.at))}</span>${esc(p.name||'Player')} pressed the emergency button. Call them now. ${p.sos.located?'GPS location below.':'Last saved location below, if there is one.'}</div>`;
  }
  const armed=Date.now()-sosArmed<4000;
  const actions=mine
    ?`<div class="actions"><button class="btn primary" onclick="openEdit()">Update stats</button><button class="btn ghost" onclick="openChar()">Edit character</button><button class="btn" onclick="openPractice()">Arena</button>${p.sos?'':`<button class="btn sos ${armed?'armed':''}" onclick="sosTap()">${armed?'Tap again to send':'SOS'}</button>`}</div>`
    :`<div class="actions">${NUDGES.filter(n=>!n.hidden).map(n=>`<button class="nudge" title="${esc(n.t)}" aria-label="${esc(n.t)}" onclick="sendNudge('${esc(id)}','${n.k}',this)">${px(n.i)}</button>`).join('')}</div>
      <div class="hint">Hug · love · snack · water · rest · request update</div>
      <div class="actions"><button class="btn warn" onclick="challenge('${esc(id)}')">${px('⚔️')} Fight ${esc(p.name||'them')}!</button></div>`;
  return `<section class="card ${stale?'stale':''}" style="--c:${col}">
    <div class="head"><div class="avatar">${px(av)}</div>
      <div class="who"><div class="name px">${crownActive(p)?px('👑')+' ':''}${esc((p.name||'Player').toUpperCase())}${mine?'<span class="you-tag">YOU</span>':''}</div>
        ${crownActive(p)?`<div class="crownline px">${esc(royalTitle(p).toUpperCase())} · until ${esc(new Date(p.crown.until).toLocaleDateString([], {weekday:'short'}))}</div>`:''}
        <div class="meta">LV ${level(p)} ${esc(shownClass(id,p))}${(p.wins||p.losses)?` · W${p.wins||0} L${p.losses||0}`:''}${(p.wins||p.losses||p.tw)?` · ${p.tw||0}/${CROWN_AT} to the crown`:''}</div>
        <div class="hearts">${hearts(p.stats)}</div></div>
      <div class="seen ${stale?'old':''}"><b>${stale?'STALE':'LAST SEEN'}</b>${esc(ago(p.updatedAt))}</div>
    </div>
    ${sos}${quest}${locBlock(p.loc)}
    ${chips?`<div class="chips">${chips}</div>`:''}
    <div class="bars">${bars}</div>
    ${p.note?`<div class="box note"><span class="lbl">STATUS MESSAGE</span>${esc(p.note)}</div>`:''}
    ${actions}
    ${log?`<details class="log"><summary>Recent check-ins</summary>${log}</details>`:''}
  </section>`;
}

function freshNudges(){
  const me=players[S.playerId]; if(!me) return [];
  const seen=me.nudgesSeenAt?new Date(me.nudgesSeenAt).getTime():0;
  return nudges.filter(n=>n.to_player===S.playerId&&new Date(n.created_at).getTime()>seen).slice(0,8);
}
function renderAlerts(){
  const fresh=freshNudges();
  const pend=sosPending?`<div class="alert" style="border-color:var(--red)"><div class="px" style="color:#fff">${px('🆘')} SOS NOT SENT YET</div>
    <p style="margin-bottom:10px">No connection. Retrying every 15 seconds. <b>In danger? Call 999 now.</b></p>
    <div class="row"><button class="btn warn" onclick="sendSOS()">Try now</button><button class="btn ghost" onclick="sosPending=false;renderAlerts()">Stop</button></div></div>`:'';
  const ob=getOutbox(), wait=ob&&ob.code===S.code?`<div class="banner">${px('📶')} <b>A check-in is saved on this phone</b>, waiting for signal. It sends automatically when you're back online.${ob.doc&&ob.doc.quest&&ob.doc.quest.backBy?' <b>Your back-by timer has not started yet.</b>':''} <button class="btn small" onclick="refresh()">Try now</button></div>`:'';
  if(!fresh.length){$('#alerts').innerHTML=wait+pend;return}
  const rows=fresh.map(n=>{const k=NUDGES.find(x=>x.k===n.kind);if(!k)return'';
    return `<li>${px(k.i)} <b>${esc(players[n.from_player]?.name||'Someone')}</b> ${esc(k.t)} <span style="color:var(--muted)">· ${esc(ago(n.created_at))}</span></li>`}).join('');
  $('#alerts').innerHTML=wait+pend+`<div class="alert"><div class="px">! NEW MESSAGE${fresh.length>1?'S':''}</div><ul>${rows}</ul>
    <div class="row"><button class="btn" onclick="ackNudges()">OK</button>${fresh.some(n=>n.kind==='ping')?'<button class="btn primary" onclick="ackNudges();openEdit()">Send update</button>':''}${fightFrom(fresh)?`<button class="btn warn" onclick="acceptFight('${esc(fightFrom(fresh))}')">Fight!</button>`:''}</div></div>`;
}

    <div class="field"><label for="cRoyal">Title when you win the crown</label><select id="cRoyal" onchange="(editChar||draftChar).royal=this.value">${['Queen','King','Ruler'].map(r=>`<option ${(c.royal||'Ruler')===r?'selected':''}>${r}</option>`).join('')}</select></div>

function claim(id){ if(!players[id]) return; S.playerId=id; saveStore(); render(); resyncPush(); toast('Welcome back, '+(players[id].name||'Player')+'.') }
async function createChar(){
  const name=$('#cName').value.trim(); if(!name){toast('Your character needs a name.');return}
  const id=uuid(), now=new Date().toISOString();
  const doc={name,cls:$('#cCls').value||'Wizard',royal:$('#cRoyal').value||'Ruler',avatar:draftChar.avatar,colour:draftChar.colour,
    stats:Object.fromEntries(STATS.map(s=>[s.k,7])),status:[],note:'',quest:null,loc:null,updatedAt:now,checkins:0,log:[],nudgesSeenAt:now,tz:tzName()};
  $('#mkBtn').disabled=true;
  try{await rpc('player_save',{p_code:S.code,p_id:id,p_data:doc});S.playerId=id;saveStore();players[id]=doc;draftChar=null;whoNew=false;document.activeElement&&document.activeElement.blur();render();toast('Character created. Welcome, '+name+'.')}
  catch(e){toast('Couldn’t save: '+e.message,5000);$('#mkBtn').disabled=false}
}
function tzName(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return ''}}

/* ---------- saving (with an outbox for when there is no signal) ---------- */
let saving=false, flushing=false;
const OUTBOX='tunga-outbox-v1';
function getOutbox(){try{return JSON.parse(localStorage.getItem(OUTBOX)||'null')}catch(e){return null}}
function setOutbox(v){try{v?localStorage.setItem(OUTBOX,JSON.stringify(v)):localStorage.removeItem(OUTBOX)}catch(e){}}
async function saveMe(doc,okMsg,event,quiet){
  if(saving) return false; saving=true;
  try{
    await rpc('player_save',{p_code:S.code,p_id:S.playerId,p_data:doc});
    players[S.playerId]=doc; if(okMsg) toast(okMsg);
    const ob=getOutbox(), events=ob&&ob.code===S.code&&ob.id===S.playerId?ob.events||[]:[];
    if(ob){setOutbox(null);renderAlerts()}
    [...new Set([...events,...(event?[event]:[])])].forEach(ev=>notify({action:'event',code:S.code,from:S.playerId,type:ev}));
    return true;
  }catch(e){
    if(e.offline&&event!=='sos'&&event!=='soslocation'){
      const ob=getOutbox(), events=ob&&ob.code===S.code&&ob.id===S.playerId?ob.events||[]:[];
      if(event&&!events.includes(event)) events.push(event);
      setOutbox({code:S.code,id:S.playerId,doc,events:events.slice(-4)});
      players[S.playerId]=doc;
      if(!quiet) toast('No signal. Saved on this phone and it will send by itself when you’re back in signal.'+(doc.quest&&doc.quest.backBy?' Your back-by timer won’t start until then.':''),8000);
      renderAlerts(); return true;
    }
    if(!quiet)toast('Couldn’t save: '+e.message+'. Try again when you have signal.',5000);return false
  }
  finally{saving=false}
}
async function flushOutbox(){
  const ob=getOutbox(); if(!ob||flushing||saving) return;
  if(ob.code!==S.code||ob.id!==S.playerId){setOutbox(null);return}
  flushing=true;
  try{
    await rpc('player_save',{p_code:ob.code,p_id:ob.id,p_data:ob.doc});
    const cur=getOutbox();
    if(cur&&JSON.stringify(cur.doc)===JSON.stringify(ob.doc)) setOutbox(null);
    else if(cur){cur.events=(cur.events||[]).filter(e=>!(ob.events||[]).includes(e));setOutbox(cur)}
    (ob.events||[]).forEach(ev=>notify({action:'event',code:ob.code,from:ob.id,type:ev}));
    toast('Back in signal. Your saved check-in has been sent.',5000); renderAlerts();
  }catch(e){if(!e.offline){setOutbox(null);toast('A saved check-in couldn’t be sent: '+e.message,6000);renderAlerts()}}
  finally{flushing=false}
}

/* ---------- SOS ---------- */
let sosArmed=0, sosPending=false, sosTimer=null;
function sosTap(){
  if(Date.now()-sosArmed>4000){sosArmed=Date.now();render();setTimeout(()=>{if(!busy())render()},4100);return}
  sosArmed=0; sendSOS();
}
async function sendSOS(){
  clearTimeout(sosTimer);
  for(let i=0;i<30&&saving;i++) await new Promise(r=>setTimeout(r,100));
  const p=players[S.playerId]; if(!p) return;
  const now=new Date().toISOString();
  const log=[{at:now,stats:p.stats,note:'SOS sent'},...(p.log||[])].slice(0,20);
  const ok=await saveMe({...p,sos:{at:now},updatedAt:now,log,tz:tzName()},null,'sos',true);
  if(!ok){sosPending=true;renderAlerts();sosTimer=setTimeout(()=>{if(sosPending)sendSOS()},15000);return}
  sosPending=false; render(); toast('SOS sent to your party. In danger? Call 999.',8000);
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    for(let i=0;i<30&&saving;i++) await new Promise(r=>setTimeout(r,100));
    const cur=players[S.playerId]; if(!cur||!cur.sos) return;
    const at=new Date().toISOString();
    const loc={text:(cur.loc&&cur.loc.text)||'',lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy),at};
    if(await saveMe({...cur,loc,sos:{...cur.sos,located:at},updatedAt:at},null,'soslocation',true)){toast('GPS location sent to your party.',5000);if(!busy())render()}
  },()=>{toast('No GPS fix. Your party has your last saved location only.',7000)},{enableHighAccuracy:true,timeout:20000,maximumAge:30000});
}
async function sosClear(btn){
  const p=players[S.playerId]; if(!p||!p.sos) return; btn.disabled=true;
  const now=new Date().toISOString();
  const log=[{at:now,stats:p.stats,note:'SOS cancelled: OK'},...(p.log||[])].slice(0,20);
  const ok=await saveMe({...p,sos:null,updatedAt:now,log,tz:tzName()},'SOS cancelled. Party told you’re OK.','sosclear');
  if(ok) render(); else btn.disabled=false;
}

/* ---------- update stats sheet ---------- */
let edit=null;
function openEdit(){
  const p=players[S.playerId]; if(!p) return;
  edit={stats:{...p.stats},status:[...(p.status||[])],loc:p.loc?{...p.loc}:{},backDirty:false};
  const q=p.quest||{};
  const overdue=q.backBy&&Date.now()>new Date(q.backBy).getTime();
  const backVal=q.backBy?new Date(q.backBy).toTimeString().slice(0,5):'';
  $('#sheetInner').innerHTML=`<h2 class="px">UPDATE STATS</h2>
    ${STATS.map(s=>`<div class="slider" style="--sc:${s.c}"><span class="ic">${px(s.icon)}</span><span class="lb px" style="font-size:8px;color:var(--muted)">${s.label}</span>
      <input type="range" min="0" max="10" step="1" aria-label="${s.label}" value="${clamp(p.stats?.[s.k])}" oninput="edit.stats['${s.k}']=+this.value;this.nextElementSibling.textContent=this.value">
      <span class="val" style="text-align:right">${clamp(p.stats?.[s.k])}</span></div>`).join('')}
    <div class="field" style="margin-top:14px"><span class="flabel">Status effects</span>
      <div class="pick">${STATUSES.map(s=>`<button type="button" class="${edit.status.includes(s.k)?'sel':''}" onclick="toggleStatus(this,'${s.k}')">${px(s.i)} ${esc(s.t)}</button>`).join('')}</div></div>
    <div class="field"><label for="eNote">Status message</label><textarea id="eNote" maxlength="280" placeholder="How's it going?">${esc(p.note||'')}</textarea></div>

    <h3>${px('⚔️')} QUEST + BACK-BY TIME</h3>
    ${overdue?'<p class="bad" style="margin-bottom:8px">This quest is overdue. Set a new back-by time or mark it done.</p>':''}
    <div class="field"><label for="eQuest">What you're doing (leave blank for none)</label><input type="text" id="eQuest" maxlength="80" value="${esc(q.text||'')}" placeholder="e.g. Bat survey, Thetford">
      <div class="row" style="margin-top:8px"><span style="color:var(--muted)">Back by</span><input type="time" id="eBack" value="${backVal}" style="max-width:140px" oninput="edit.backDirty=true">
        <button class="btn small" type="button" onclick="backIn(1)">+1h</button><button class="btn small" type="button" onclick="backIn(2)">+2h</button><button class="btn small" type="button" onclick="backIn(4)">+4h</button></div>
      <div class="hint">Pass this time without checking in and your party gets an overdue alert, repeating every 15 minutes.</div>
      ${q.text?'<div class="rowbtns"><button class="btn small ghost" type="button" onclick="clearQuestFields()">Clear quest</button></div>':''}</div>

    <h3>${px('📍')} LOCATION</h3>
    <div id="locState"></div>
    <div class="rowbtns" style="margin:8px 0 10px"><button class="btn small" type="button" id="locBtn" onclick="grabLoc()">Use my current location</button>
      <button class="btn small ghost" type="button" onclick="edit.loc={};$('#eLocText').value='';paintLoc()">Clear</button></div>
    <div class="field"><label for="eLocText">Place, site name or what3words</label><input type="text" id="eLocText" maxlength="100" autocapitalize="none" value="${esc(p.loc?.text||'')}" placeholder="e.g. ///filled.count.soap or Park Farm"></div>
    <div class="footer"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn primary" id="saveBtn" onclick="saveEdit()">Save</button></div>`;
  paintLoc();
  $('#sheet').classList.remove('hidden');
}
function paintLoc(){
  const l=edit&&edit.loc, el=$('#locState'); if(!el) return;
  if(l&&typeof l.lat==='number'){const g=osGrid(l.lat,l.lng);
    el.innerHTML=`<span class="ok">Fix saved:</span> ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}${l.acc?' · ±'+esc(l.acc)+' m':''}${g?' · '+g:''} <span style="color:var(--muted)">· ${esc(ago(l.at))}</span>`}
  else el.innerHTML='<span style="color:var(--muted)">No GPS fix attached.</span>';
  const b=$('#locBtn'); if(b){b.disabled=false;b.textContent=(l&&typeof l.lat==='number')?'Update location':'Use my current location'}
}
function grabLoc(){
  if(!navigator.geolocation){toast('This device won’t share location.');return}
  const b=$('#locBtn'); b.disabled=true; b.textContent='Locating…';
  navigator.geolocation.getCurrentPosition(pos=>{
    if(!edit) return;
    edit.loc={...edit.loc,lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy),at:new Date().toISOString()};
    paintLoc();
  },err=>{
    toast(err.code===1?'Location is blocked. Allow it in Settings > Privacy > Location Services.':'No fix. Try again with a clear view of the sky.',5000);
    if(edit) paintLoc();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function toggleStatus(btn,k){const i=edit.status.indexOf(k); if(i>=0) edit.status.splice(i,1); else edit.status.push(k); btn.classList.toggle('sel')}
function backIn(h){const d=new Date(Date.now()+h*3600e3);$('#eBack').value=d.toTimeString().slice(0,5);edit.backDirty=true}
function clearQuestFields(){$('#eQuest').value='';$('#eBack').value='';edit.backDirty=true}
function nextTime(hhmm){
  if(!hhmm) return null; const [h,m]=hhmm.split(':').map(Number);
  const d=new Date(); d.setHours(h,m,0,0); if(d.getTime()<=Date.now()) d.setDate(d.getDate()+1);
  return d.toISOString();
}
async function saveEdit(){
  const p=players[S.playerId], now=new Date().toISOString();
  const stats=Object.fromEntries(STATS.map(s=>[s.k,clamp(edit.stats[s.k])]));
  const note=$('#eNote').value.trim().slice(0,280);
  const qt=$('#eQuest').value.trim().slice(0,80);
  let quest=null;
  if(qt){
    const backBy=(edit.backDirty||!p.quest)?nextTime($('#eBack').value):(p.quest.backBy||null);
    if(backBy&&new Date(backBy).getTime()<=Date.now()){toast('That quest is overdue. Pick a new back-by time, or clear the quest.',5000);return}
    quest={text:qt,backBy};
  }
  const lt=$('#eLocText').value.trim().slice(0,100);
  const l=edit.loc||{};
  const loc=(typeof l.lat==='number'||lt)?{...(typeof l.lat==='number'?{lat:l.lat,lng:l.lng,acc:l.acc,at:l.at}:{at:now}),text:lt}:null;
  const log=[{at:now,stats,note},...(p.log||[])].slice(0,20);
  $('#saveBtn').disabled=true;
  const ok=await saveMe({...p,stats,status:edit.status.slice(0,12),note,quest,loc,updatedAt:now,checkins:(p.checkins||0)+1,log,tz:tzName()},'Saved. Checkpoint reached.','update');
  if(ok) closeSheet(); else $('#saveBtn').disabled=false;
}
async function questDone(btn){
  const p=players[S.playerId]; if(!p||!p.quest) return; btn.disabled=true;
  const now=new Date().toISOString();
  const log=[{at:now,stats:p.stats,note:'Safe. Quest done: '+p.quest.text},...(p.log||[])].slice(0,20);
  const ok=await saveMe({...p,quest:null,updatedAt:now,checkins:(p.checkins||0)+1,log,tz:tzName()},'Quest complete. Party told you’re safe.','safe');
  if(ok) render(); else btn.disabled=false;
}
async function extendQuest(btn){
  const p=players[S.playerId]; if(!p||!p.quest||!p.quest.backBy) return; btn.disabled=true;
  const base=Math.max(Date.now(),new Date(p.quest.backBy).getTime());
  const backBy=new Date(base+30*60e3).toISOString(), now=new Date().toISOString();
  const ok=await saveMe({...p,quest:{...p.quest,backBy},updatedAt:now,tz:tzName()},'Extended to '+clock(backBy)+'.','extend');
  if(ok) render(); else btn.disabled=false;
}

/* ---------- edit character ---------- */
function openChar(){
  const p=players[S.playerId]; editChar={name:p.name,cls:p.cls,royal:p.royal,avatar:p.avatar,colour:p.colour};
  $('#sheetInner').innerHTML=`<h2 class="px">EDIT CHARACTER</h2>${charFields(editChar)}
    <div class="footer"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn primary" onclick="saveChar()">Save</button></div>`;
  $('#sheet').classList.remove('hidden');
}
async function saveChar(){
  const name=$('#cName').value.trim(); if(!name){toast('Name required.');return}
  const p=players[S.playerId];
  const ok=await saveMe({...p,name,cls:$('#cCls').value||'Wizard',royal:$('#cRoyal').value||'Ruler',avatar:editChar.avatar,colour:editChar.colour},'Character updated.');
  if(ok) closeSheet();
}
function closeSheet(){$('#sheet').classList.add('hidden');edit=null;editChar=null;if(loaded)render()}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* ---------- nudges ---------- */
async function sendNudge(target,kind,btn){
  if(!players[S.playerId]) return; btn.disabled=true;
  try{
    await rpc('nudge_send',{p_code:S.code,p_from:S.playerId,p_to:target,p_kind:kind});
    notify({action:'event',code:S.code,from:S.playerId,type:'nudge',to:target,kind});
    toast('Sent.');
  }catch(e){toast('Couldn’t send: '+e.message,4000)}
  setTimeout(()=>{btn.disabled=false},4000);
}
async function ackNudges(){
  const p=players[S.playerId], fresh=freshNudges(); if(!p||!fresh.length) return;
  const latest=fresh.reduce((a,n)=>Math.max(a,new Date(n.created_at).getTime()),0);
  $('#alerts').innerHTML='';
  await saveMe({...p,nudgesSeenAt:new Date(latest).toISOString()});
}

/* ---------- arena ---------- */
const CROWN_AT=15;
function crownActive(p){return !!(p&&p.crown&&p.crown.until&&new Date(p.crown.until).getTime()>Date.now())}
function ruler(){let best=null;Object.entries(players).forEach(([id,p])=>{if(crownActive(p)&&(!best||p.crown.at>best[1].crown.at))best=[id,p]});return best}
function royalTitle(p){const r=['Queen','King'].includes(p.royal)?p.royal:'Ruler';return r+' of the Arena'}
function shownClass(id,p){const r=ruler();return r&&r[0]!==id?'Peasant':(p.cls||'Adventurer')}
let lastSync='';
function syncTally(){
  const me=players[S.playerId]; if(!me||saving) return;
  let latest='';Object.entries(players).forEach(([id,p])=>{if(id!==S.playerId&&p.crown&&p.crown.at>latest)latest=p.crown.at});
  if(latest&&latest>(me.tallyResetAt||'')&&latest!==lastSync){lastSync=latest;saveMe({...me,tw:0,tallyResetAt:latest},null,null,true)}
}
function fighterInfo(id){const p=players[id]||{};return {id,name:p.name||'Player',cls:p.cls,colour:p.colour,stats:p.stats||{},crown:crownActive(p)}}
const FIGHT_KINDS=['fight','ready'];
function fightFrom(fresh){const n=fresh.find(n=>FIGHT_KINDS.includes(n.kind)&&players[n.from_player]&&Date.now()-new Date(n.created_at).getTime()<10*60e3);return n?n.from_player:''}
function openPractice(){
  const other=Object.keys(players).find(id=>id!==S.playerId);
  const opp=other?fighterInfo(other):{id:'cpu',name:'Dummy',cls:'Knight',colour:'#94b0c2',stats:{energy:5,food:5,water:5,stamina:5,mood:5,social:5}};
  Arena.open({mode:'cpu',me:fighterInfo(S.playerId),opp,onClose:()=>{if(loaded)render()}});
}
function openFight(oppId){
  const ids=[S.playerId,oppId].sort();
  Arena.open({mode:'net',me:fighterInfo(S.playerId),opp:fighterInfo(oppId),net:{url:BASE,key:KEY,room:'tunga-'+S.code+'-'+ids[0].slice(0,8)+'-'+ids[1].slice(0,8)},
    onResult:(won)=>fightResult(won,oppId),onClose:()=>{if(loaded){refresh();render()}}});
}
/* Challenge, or answer a challenge. Either way the other phone gets a notification, at most once a minute. */
function challenge(id){
  if(!players[S.playerId]||!players[id]) return;
  openFight(id);                                  // open straight away so sound is allowed to start
  const now=Date.now(), age=n=>now-new Date(n.created_at).getTime();
  const seen=new Date(players[id].nudgesSeenAt||0).getTime();     // don't re-ping a challenge they haven't seen yet
  const mineRecent=nudges.find(n=>n.from_player===S.playerId&&n.to_player===id&&FIGHT_KINDS.includes(n.kind)&&age(n)<10*60e3&&new Date(n.created_at).getTime()>seen);
  const theirs=nudges.find(n=>n.from_player===id&&n.to_player===S.playerId&&FIGHT_KINDS.includes(n.kind)&&age(n)<10*60e3);
  if(mineRecent) return;
  const kind=theirs?'ready':'fight';
  rpc('nudge_send',{p_code:S.code,p_from:S.playerId,p_to:id,p_kind:kind})
    .then(()=>{nudges.unshift({from_player:S.playerId,to_player:id,kind,created_at:new Date().toISOString()});notify({action:'event',code:S.code,from:S.playerId,type:'nudge',to:id,kind})})
    .catch(e=>toast('Couldn’t send the challenge: '+e.message,5000));
}
function acceptFight(id){challenge(id);ackNudges()}
function fightResult(won,oppId){
  const p=players[S.playerId]; if(!p) return '';
  const now=new Date(), doc={...p,wins:(p.wins||0)+(won?1:0),losses:(p.losses||0)+(won?0:1),tw:(p.tw||0)+(won?1:0)};
  const opp=players[oppId]||{}, oppTw=(opp.tw||0)+(won?0:1);
  let note=`First to ${CROWN_AT}: you ${doc.tw}, ${opp.name||'them'} ${Math.min(oppTw,CROWN_AT)}`, crowned=false;
  if(won&&doc.tw>=CROWN_AT){crowned=true;doc.crown={at:now.toISOString(),until:new Date(now.getTime()+7*864e5).toISOString()};doc.tw=0;doc.tallyResetAt=doc.crown.at;
    note=`That's ${CROWN_AT}! You're ${royalTitle(doc)} for a week.`}
  (async()=>{
    for(let i=0;i<30&&saving;i++) await new Promise(r=>setTimeout(r,100));
    await saveMe(doc,null,null,true);
    if(crowned) Object.keys(players).filter(id=>id!==S.playerId).forEach(id=>{
      rpc('nudge_send',{p_code:S.code,p_from:S.playerId,p_to:id,p_kind:'crown'}).then(()=>notify({action:'event',code:S.code,from:S.playerId,type:'nudge',to:id,kind:'crown'})).catch(()=>{});
    });
  })();
  return note;
}

/* ---------- settings: invite, notifications, leave ---------- */
function inviteText(){return `Join my party on TUNGA (The Ultimate Needy Girlfriend App).\n1. Open ${location.origin+location.pathname}\n2. Add it to your home screen and open it from there\n3. Join with code ${fmtCode(S.code)}`}
async function copyInvite(){try{await navigator.clipboard.writeText(inviteText());toast('Invite copied.')}catch(e){toast('Couldn’t copy. Press and hold the code instead.',4000)}}
function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) return (isIOS()&&!standalone())?'install':'unsupported';
  return Notification.permission;
}
function openSettings(){
  $('#sheetInner').innerHTML=`<h2 class="px">SETTINGS</h2>
    <h3 style="margin-top:0">PARTY CODE</h3>
    <div class="code">${esc(fmtCode(S.code))}</div>
    <div class="row"><button class="btn small" onclick="copyInvite()">Copy invite</button></div>
    <div class="hint">Anyone with this code can see the party. Only share it with your player 2.</div>
    <h3>PLAYERS</h3><div id="playersBox"></div>
    <div class="hint">Removing a player deletes their character and history for good.</div>
    <h3>NOTIFICATIONS</h3><div id="pushBox"></div>
    <h3>THIS DEVICE</h3>
    <div class="row"><button class="btn small warn" id="leaveBtn" onclick="leaveAsk()">Leave party on this device</button></div>
    <div class="hint">Your character stays in the party. Rejoin with the code and reclaim it.</div>
    <div class="footer"><span></span><button class="btn ghost" onclick="closeSheet()">Close</button></div>`;
  paintPlayers(); paintPush();
  $('#sheet').classList.remove('hidden');
}
let removeArmed='';
function paintPlayers(){
  const box=$('#playersBox'); if(!box) return;
  box.innerHTML=Object.entries(players).map(([id,p])=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px dashed #333c57">
    <span>${px(AVATARS.includes(p.avatar)?p.avatar:'👾')} ${esc(p.name||'Player')}${id===S.playerId?' <span style="color:var(--muted)">(you)</span>':''} <span style="color:var(--muted)">· ${esc(ago(p.updatedAt))}</span></span>
    <button class="btn small ${removeArmed===id?'warn':'ghost'}" onclick="removePlayer('${esc(id)}')">${removeArmed===id?'Tap again to remove':'Remove'}</button></div>`).join('')||'<p>No players yet.</p>';
}
async function removePlayer(id){
  if(removeArmed!==id){removeArmed=id;paintPlayers();setTimeout(()=>{if(removeArmed===id){removeArmed='';paintPlayers()}},4000);return}
  removeArmed='';
  try{
    await rpc('player_remove',{p_code:S.code,p_id:id});
    const name=(players[id]&&players[id].name)||'Player'; delete players[id];
    if(id===S.playerId){S.playerId=null;saveStore();closeSheet();toast('Your character was removed.');return}
    paintPlayers(); toast(name+' removed.');
  }catch(e){toast(/player_remove/.test(e.message)?'The server needs its small update first (the SQL paste).':'Couldn’t remove: '+e.message,6000);paintPlayers()}
}
async function paintPush(){
  const box=$('#pushBox'); if(!box) return; const st=pushState();
  if(st==='install'){box.innerHTML='<p>Add this app to your home screen first (Share, then Add to Home Screen) and open it from there. iPhones only allow notifications from the installed version.</p>';return}
  if(st==='unsupported'){box.innerHTML='<p>This browser can’t do notifications. On iPhone you need iOS 16.4 or later.</p>';return}
  if(st==='denied'){box.innerHTML='<p class="bad">Notifications are blocked for this app. Turn them on in Settings > Notifications > TUNGA, then come back.</p>';return}
  if(!players[S.playerId]){box.innerHTML='<p>Create your character first.</p>';return}
  let sub=null; try{const reg=await swReady; sub=reg&&await reg.pushManager.getSubscription()}catch(e){}
  if(st==='granted'&&sub){box.innerHTML='<p class="ok">On for this device.</p><div class="rowbtns"><button class="btn small" id="testBtn" onclick="testPush()">Send me a test</button><button class="btn small ghost" id="pushBtn" onclick="enablePush(true)">Re-register this phone</button></div><div class="hint">No test arriving? Tap Re-register, then test again. Also check iPhone Settings > Notifications > TUNGA.</div>';return}
  box.innerHTML='<p>Get a ping when your party checks in, nudges you, or goes overdue.</p><div class="rowbtns"><button class="btn small primary" id="pushBtn" onclick="enablePush()">Turn on notifications</button></div>';
}
function keyBytes(b64){b64=b64.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
async function enablePush(fresh){
  const btn=$('#pushBtn'); if(btn) btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications not allowed.');paintPush();return}
    const reg=await swReady; if(!reg) throw new Error('no service worker');
    await navigator.serviceWorker.ready;
    const k=await notify({action:'key'});
    if(!k||!k.publicKey){toast('The notification server isn’t answering yet.',5000);paintPush();return}
    let sub=await reg.pushManager.getSubscription();
    if(sub&&fresh===true){await rpc('push_remove',{p_endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe().catch(()=>{});sub=null}
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(k.publicKey)});
    await rpc('push_save',{p_code:S.code,p_player:S.playerId,p_sub:sub.toJSON()});
    toast(fresh===true?'Phone re-registered. Now send a test.':'Notifications on.');
  }catch(e){toast('Couldn’t turn on notifications: '+e.message,5000)}
  paintPush();
}
async function resyncPush(){
  try{
    if(pushState()!=='granted'||!S.playerId) return;
    const reg=await swReady; const sub=reg&&await reg.pushManager.getSubscription();
    if(sub) await rpc('push_save',{p_code:S.code,p_player:S.playerId,p_sub:sub.toJSON()});
  }catch(e){}
}
async function testPush(){
  const b=$('#testBtn'); b.disabled=true;
  const r=await notify({action:'event',code:S.code,from:S.playerId,type:'test'});
  toast(!r?'The notification server didn’t answer.'
    :r.sent?'Test sent. It should arrive in a few seconds. Nothing? Check iPhone Settings > Notifications > TUNGA, and Focus modes.'
    :!r.devices?'The server has no record of this phone. Tap Re-register this phone, then test again.'
    :'The push service refused it: '+((r.why||[]).join('; ')||'no reason given')+'. Tell Lari exactly what this says.',9000);
  setTimeout(()=>{b.disabled=false},4000);
}
let leaveArmed=false;
function leaveAsk(){
  if(!leaveArmed){leaveArmed=true;$('#leaveBtn').textContent='Tap again to confirm';setTimeout(()=>{leaveArmed=false;const b=$('#leaveBtn');if(b)b.textContent='Leave party on this device'},4000);return}
  leaveNow();
}
async function leaveNow(){
  try{const reg=await swReady;const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await rpc('push_remove',{p_endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe().catch(()=>{})}}catch(e){}
  try{localStorage.removeItem(STORE)}catch(e){}
  location.hash=''; location.reload();
}
boot();
</script>
